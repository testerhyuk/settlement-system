services:
  postgresql:
    image: postgres:17
    container_name: postgres-settlement
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=settlement-system
      - POSTGRES_USER=hyuk
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka-1:
    image: apache/kafka:3.7.0
    container_name: kafka-1
    mem_limit: 768m
    mem_reservation: 512m
    user: "1000:1000"
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: settlement-kafka-cluster
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:3.7.0
    container_name: kafka-2
    mem_limit: 768m
    mem_reservation: 512m
    user: "1000:1000"
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: settlement-kafka-cluster
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:3.7.0
    container_name: kafka-3
    mem_limit: 768m
    mem_reservation: 512m
    user: "1000:1000"
    ports:
      - "39092:39092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:39092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: settlement-kafka-cluster
    volumes:
      - kafka3_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    mem_limit: 384m
    mem_reservation: 256m
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: settlement-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka-1:9092
      - --kafka.server=kafka-2:9092
      - --kafka.server=kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - kafka-exporter
      - api-server
      - ad-streams
      - clickhouse

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    mem_limit: 256m
    mem_reservation: 128m
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api-server
    mem_limit: 768m
    mem_reservation: 512m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialRAMPercentage=30 -XX:MaxRAMPercentage=60
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/settlement-system
      - SPRING_DATASOURCE_USERNAME=hyuk
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - FEIGN_AD-STREAMS_URL=http://ad-streams:8083
      - SPRING_KAFKA_CLUSTERS_PRIMARY_BOOTSTRAP-SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SPRING_KAFKA_CLUSTERS_DR_BOOTSTRAP-SERVERS=kafka-dr-1:9092,kafka-dr-2:9092,kafka-dr-3:9092
    depends_on:
      - postgresql
      - kafka-1
      - kafka-2
      - kafka-3
      - ad-streams
    networks:
      default:
        ipv4_address: 172.18.0.101

  nginx:
    image: nginx:latest
    container_name: nginx
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-server
    networks:
      default:
        ipv4_address: 172.18.0.100

  ad-streams:
    build:
      context: .
      dockerfile: Dockerfile.streams
    container_name: ad-streams
    mem_limit: 768m
    mem_reservation: 512m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialRAMPercentage=30 -XX:MaxRAMPercentage=60
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/settlement-system
      - SPRING_DATASOURCE_USERNAME=hyuk
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - FEIGN_AD-STREAMS_URL=http://ad-streams:8083
    depends_on:
      - postgresql
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      default:
        ipv4_address: 172.18.0.102

  k6:
    image: grafana/k6:latest
    container_name: k6
    mem_limit: 256m
    mem_reservation: 128m
    volumes:
      - ./k6:/scripts
    command: run /scripts/ad-analytics-load-test.js
    depends_on:
      - nginx

  redis-lock:
    image: redis:7
    container_name: redis-lock
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "6380:6379"

  redis-cache-master:
    image: redis:7
    container_name: redis-cache-master
    mem_limit: 256m
    mem_reservation: 128m
    ports:
      - "6390:6379"
    command: redis-server --appendonly yes

  redis-cache-replica:
    image: redis:7
    container_name: redis-cache-replica
    mem_limit: 256m
    mem_reservation: 128m
    ports:
      - "6391:6379"
    command: redis-server --replicaof redis-cache-master 6379 --appendonly yes
    depends_on:
      - redis-cache-master

  redis-sentinel-1:
    image: redis:7
    container_name: redis-sentinel-1
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "26379:26379"
    command: >
      sh -c "echo 'port 26379' > /tmp/sentinel.conf &&
         echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
         echo 'sentinel monitor mymaster redis-cache-master 6379 2' >> /tmp/sentinel.conf &&
         echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
         echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
         echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
         redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-cache-master
      - redis-cache-replica

  redis-sentinel-2:
    image: redis:7
    container_name: redis-sentinel-2
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "26380:26379"
    command: >
      sh -c "echo 'port 26379' > /tmp/sentinel.conf &&
         echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
         echo 'sentinel monitor mymaster redis-cache-master 6379 2' >> /tmp/sentinel.conf &&
         echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
         echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
         echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
         redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-cache-master
      - redis-cache-replica

  redis-sentinel-3:
    image: redis:7
    container_name: redis-sentinel-3
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "26381:26379"
    command: >
      sh -c "echo 'port 26379' > /tmp/sentinel.conf &&
         echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
         echo 'sentinel monitor mymaster redis-cache-master 6379 2' >> /tmp/sentinel.conf &&
         echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
         echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
         echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
         redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-cache-master
      - redis-cache-replica

  kafka-dr-1:
    image: apache/kafka:3.7.0
    container_name: kafka-dr-1
    mem_limit: 768m
    mem_reservation: 512m
    user: "1000:1000"
    ports:
      - "49092:49092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:49092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-dr-1:9092,EXTERNAL://localhost:49092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-dr-1:9093,2@kafka-dr-2:9093,3@kafka-dr-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: settlement-kafka-cluster-dr
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_dr_1_data:/var/lib/kafka/data

  kafka-dr-2:
    image: apache/kafka:3.7.0
    container_name: kafka-dr-2
    mem_limit: 768m
    mem_reservation: 512m
    user: "1000:1000"
    ports:
      - "49093:49093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:49093,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-dr-2:9092,EXTERNAL://localhost:49093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-dr-1:9093,2@kafka-dr-2:9093,3@kafka-dr-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: settlement-kafka-cluster-dr
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_dr_2_data:/var/lib/kafka/data

  kafka-dr-3:
    image: apache/kafka:3.7.0
    container_name: kafka-dr-3
    mem_limit: 768m
    mem_reservation: 512m
    user: "1000:1000"
    ports:
      - "49094:49094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:49094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-dr-3:9092,EXTERNAL://localhost:49094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-dr-1:9093,2@kafka-dr-2:9093,3@kafka-dr-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: settlement-kafka-cluster-dr
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_dr_3_data:/var/lib/kafka/data

  mirror-maker:
    image: apache/kafka:3.7.0
    container_name: mirror-maker
    mem_limit: 512m
    mem_reservation: 256m
    user: "1000:1000"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - kafka-dr-1
      - kafka-dr-2
      - kafka-dr-3
    volumes:
      - ./mirror-maker/mm2.properties:/opt/kafka/config/mm2.properties
    command: >
      /opt/kafka/bin/connect-mirror-maker.sh /opt/kafka/config/mm2.properties

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-settlement
    mem_limit: 1536m
    mem_reservation: 1g
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    environment:
      CLICKHOUSE_DB: settlement_analytics
      CLICKHOUSE_USER: hyuk
      CLICKHOUSE_PASSWORD: password
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./monitoring/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  grafana_data:
  prometheus_data:
  kafka_dr_1_data:
  kafka_dr_2_data:
  kafka_dr_3_data:
  clickhouse-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
