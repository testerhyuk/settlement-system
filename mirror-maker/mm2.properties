clusters = primary, dr

primary.bootstrap.servers = kafka-1:9092,kafka-2:9092,kafka-3:9092
dr.bootstrap.servers = kafka-dr-1:9092,kafka-dr-2:9092,kafka-dr-3:9092

primary->dr.enabled = true
dr->primary.enabled = true

primary->dr.topics = budget-events,budget-results
dr->primary.topics = budget-events,budget-results

replication.factor = 3
checkpoints.topic.replication.factor = 3
heartbeats.topic.replication.factor = 3
offset-syncs.topic.replication.factor = 3

offset.storage.replication.factor = 3
status.storage.replication.factor = 3
config.storage.replication.factor = 3

replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy

retry.backoff.ms = 1000
reconnect.backoff.ms = 1000
reconnect.backoff.max.ms = 30000
request.timeout.ms = 60000

primary.producer.retries = 2147483647
primary.producer.retry.backoff.ms = 1000
primary.producer.delivery.timeout.ms = 120000
primary.producer.request.timeout.ms = 60000
primary.producer.max.block.ms = 60000

dr.producer.retries = 2147483647
dr.producer.retry.backoff.ms = 1000
dr.producer.delivery.timeout.ms = 120000
dr.producer.request.timeout.ms = 60000
dr.producer.max.block.ms = 60000

primary.consumer.session.timeout.ms = 30000
primary.consumer.heartbeat.interval.ms = 10000
primary.consumer.max.poll.interval.ms = 300000

dr.consumer.session.timeout.ms = 30000
dr.consumer.heartbeat.interval.ms = 10000
dr.consumer.max.poll.interval.ms = 300000