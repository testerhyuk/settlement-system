server:
  port: 8080

spring:
  flyway:
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5433/settlement-system
    username: hyuk
    password: ${POSTGRES_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: localhost:19092,localhost:29092,localhost:39092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    clusters:
      primary:
        bootstrap-servers: localhost:19092,localhost:29092,localhost:39092
      dr:
        bootstrap-servers: localhost:49092,localhost:49093,localhost:49094

feign:
  ad-streams:
    url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    export:
      prometheus:
        enabled: true

app:
  kafka:
    budget_results_dlt: budget-results.DLT
    budget_results_dlt_group: budget-result-dlt-group
    budget-results-topic: budget-results
    budget-events-topic: budget-events
    ad-impressions-topic: ad-impressions
    ad-clicks-topic: ad-clicks
    ad-conversions-topic: ad-conversions
    user-segments-topic: user-segments
  segment-bootstrap:
    enabled: true
